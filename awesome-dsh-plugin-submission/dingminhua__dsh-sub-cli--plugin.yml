url: https://github.com/dingminhua/dsh-sub-cli/tree/main/plugin
name: dingminhua/dsh-sub-cli#plugin
category: cli
description:
  en: Manages external Agent CLIs in DSH with an isolated unified directory, three-layer per-CLI model routes, an unref'd-turn-deadline guard (round-15/17/18), and headless dispatch plus Relay/Subagent child sessions that survive Host restarts.
  zh: 在 DSH 中统一管理外部 Agent CLI：独立统一目录、每 CLI 三层模型路由（Provider/模型/推理强度）、无头派发（cli_dispatch）与 Relay 子代理（两档权限，2 CLI：Codex/Claude Code），turn-deadline 守卫与持久化会话在 Host 重启后 reattach 同一 thread。
