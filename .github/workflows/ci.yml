# CI for dsh-sub-cli: run the plugin unit tests and dry-run the npm pack.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install
        working-directory: plugin
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: plugin
        run: pnpm test
      - name: Pack dry-run
        working-directory: plugin
        run: pnpm pack --dry-run
