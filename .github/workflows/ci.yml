# CI for dsh-sub-cli: run the plugin unit tests and dry-run the npm pack.
# The suite is cross-platform (tests branch only on win32 vs POSIX, mock
# every subprocess, and never shell out to POSIX-only commands), so it runs
# on Linux, macOS, and Windows alike — darwin and linux share one code path
# and the darwin branch is unit-tested with an explicit platform: "darwin".
# `pnpm test` needs no shell glob support: pnpm's script runner expands
# test/*.test.mjs itself, so cmd.exe on Windows is fine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        pnpm: [11.8.0]
        # The engines floor (node >= 20) is validated with the newest pnpm
        # that still runs on node 20 — pnpm 11 requires node >= 22.13 (it
        # imports node:sqlite), so node 20 must pair with pnpm 10.
        include:
          - os: ubuntu-latest
            node: 20
            pnpm: 10.34.5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}
          run_install: false
      - name: Install
        working-directory: plugin
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: plugin
        run: pnpm test
      - name: Pack dry-run
        working-directory: plugin
        run: pnpm pack --dry-run
