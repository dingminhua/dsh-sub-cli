# CI for dsh-sub-cli: run the plugin unit tests and dry-run the npm pack.
# The suite is cross-platform (tests branch on process.platform and never
# shell out to POSIX-only commands), so it runs on Linux and Windows alike.
# `pnpm test` needs no shell glob support: pnpm's script runner expands
# test/*.test.mjs itself, so cmd.exe on Windows is fine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install
        working-directory: plugin
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: plugin
        run: pnpm test
      - name: Pack dry-run
        working-directory: plugin
        run: pnpm pack --dry-run
