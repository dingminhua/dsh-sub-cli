# CI for dsh-sub-cli: run the plugin unit tests and dry-run the npm pack.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install
        working-directory: plugin
        run: npm ci
      - name: Test
        working-directory: plugin
        run: npm test
      - name: Pack dry-run
        working-directory: plugin
        run: npm pack --dry-run
